<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Peça seu orçamento na Gráfica Canaã: preencha o formulário e entraremos em contato." />
    <title>Faça seu Pedido — Gráfica Canaã</title>
    <link rel="icon" href="/img/logo.png" />
    <style>@media (prefers-reduced-motion: no-preference) { @view-transition { navigation: auto; } }</style>
    <link rel="stylesheet" href="/src/css/main.css" />
    <script>for (const ev of [`pageswap`, `pagereveal`]) addEventListener(ev, (e) => { const t = e.viewTransition; if (!t) return; for (const p of [t.ready, t.finished, t.updateCallbackDone]) p.catch(() => {}); });</script>
  </head>
  <body>
    <div id="site-header"></div>

    <main>
      <section class="titulo-faixa">
        <div class="container">
          <div>
            <h1>Formulário de Pedido</h1>
            <p>Preencha o formulário com os detalhes de seu pedido, e em breve entraremos em contato!</p>
          </div>
        </div>
      </section>

      <form class="form container" id="form-pedido" novalidate>
        <div>
          <label for="produto">Qual produto você busca?</label>
          <select id="produto" required></select>
        </div>
        <div>
          <label for="detalhes">Nos dê detalhes sobre seu pedido...</label>
          <textarea id="detalhes" placeholder="Digite aqui sobre..."></textarea>
        </div>
        <div>
          <label for="nome">Seu Nome</label>
          <input id="nome" type="text" placeholder="Digite seu nome..." />
        </div>
        <div>
          <label for="contato-forma">De que forma deveríamos entrar em contato com você?</label>
          <select id="contato-forma">
            <option value="">E-mail... WhatsApp...</option>
            <option value="email">E-mail</option>
            <option value="whatsapp">WhatsApp</option>
          </select>
        </div>
        <div>
          <label for="contato">Número de Celular/Endereço de E-mail</label>
          <input id="contato" type="text" placeholder="+55 XX XXXX-XXXXX" />
        </div>
        <div>
          <label for="retirada">O pedido será retirado na gráfica?</label>
          <select id="retirada">
            <option value="sim">Sim</option>
            <option value="nao">Não</option>
          </select>
        </div>
        <div>
          <label for="entrega" id="label-entrega">Nome de quem irá retirar o pedido</label>
          <input id="entrega" type="text" placeholder="Digite seu..." />
        </div>
        <div>
          <label for="arquivo">Insira uma imagem de exemplo de como você quer que seu produto fique (Não é obrigatório! Imagem, PDF)</label>
          <input id="arquivo" type="file" accept=".pdf,.png,.jpg,.jpeg" />
        </div>
        <div>
          <label for="obs">Observações finais? (Não é obrigatório)</label>
          <textarea id="obs" placeholder="Digite aqui sobre..."></textarea>
        </div>

        <p class="aviso" id="aviso" hidden>Protótipo: o formulário ainda não envia dados.</p>
        <button class="btn enviar" type="submit">Enviar formulário</button>
      </form>
    </main>

    <div id="site-footer"></div>
    <script type="module" blocking="render" src="/src/js/layout.js"></script>
    <script type="module" blocking="render" src="/src/js/pedido.js"></script>
  </body>
</html>
